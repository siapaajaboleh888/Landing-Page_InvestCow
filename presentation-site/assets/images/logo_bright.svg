<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d2a" />
      <stop offset="100%" stop-color="#082016" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer circular badge with emerald border -->
  <circle cx="100" cy="100" r="92" fill="url(#logoBg)" stroke="#34d399" stroke-width="4" filter="url(#glow)" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(110, 231, 183, 0.4)" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- Cow Icon silhouette with bright, high-contrast colors -->
  <g fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
    <!-- Horns -->
    <path d="M 64 68 C 50 46 62 34 76 42 C 68 52 68 60 70 70 Z" />
    <path d="M 136 68 C 150 46 138 34 124 42 C 132 52 132 60 130 70 Z" />
    <!-- Ears -->
    <path d="M 52 76 C 36 74 32 82 44 88 C 52 86 56 82 60 78 Z" />
    <path d="M 148 76 C 164 74 168 82 156 88 C 148 86 144 82 140 78 Z" />
    <!-- Forehead & Face -->
    <path d="M 72 62 L 128 62 C 134 82 132 108 126 120 L 74 120 C 68 108 66 82 72 62 Z" />
  </g>

  <!-- White Snout / Muzzle for high contrast -->
  <path d="M 68 116 C 68 108 132 108 132 116 C 132 135 120 142 100 142 C 80 142 68 135 68 116 Z" fill="#ffffff" stroke="#10b981" stroke-width="2" />

  <!-- Eyes -->
  <circle cx="82" cy="88" r="5" fill="#ffffff" stroke="#082016" stroke-width="1.5" />
  <circle cx="118" cy="88" r="5" fill="#ffffff" stroke="#082016" stroke-width="1.5" />
  <circle cx="83" cy="87" r="2.2" fill="#082016" />
  <circle cx="117" cy="87" r="2.2" fill="#082016" />

  <!-- Nostrils -->
  <ellipse cx="88" cy="126" rx="3.5" ry="4" fill="#082016" />
  <ellipse cx="112" cy="126" rx="3.5" ry="4" fill="#082016" />

  <!-- Star Accent on forehead -->
  <polygon points="100,70 102,76 108,78 102,80 100,86 98,80 92,78 98,76" fill="#f59e0b" />

  <!-- Bright, readable typography -->
  <text x="100" y="166" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="900" letter-spacing="1.2">INVESTCOW</text>
  <text x="100" y="179" text-anchor="middle" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.8">LIVESTOCK PLATFORM</text>
</svg>
